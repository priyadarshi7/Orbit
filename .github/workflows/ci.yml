name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The AI SDK, better-sqlite3, Vitest and react-router all require Node >= 22, so that is the floor.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Tests use scripted fake models and a fake search provider: no API keys are needed or used.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  smoke:
    name: Fresh-clone smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A reviewer runs `npm install && npm run dev` with no .env. The API must still boot and say what is missing.
      - name: API boots without any keys
        env:
          PORT: "8123"
          DB_PATH: ":memory:"
        run: |
          npx tsx src/server/index.ts > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8123/api/health | grep -q '"ok":true'
          grep -q "no API key" api.log
      - name: Benchmark endpoint serves the committed results
        run: |
          curl -sf http://localhost:8123/api/benchmarks | grep -q '"models"'

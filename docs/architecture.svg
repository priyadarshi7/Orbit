<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Orbit architecture</title>
<desc id="d">A request flows from the browser to the API, through context assembly and a router, down either a fast single-agent path or a deep plan-research-synthesize-verify path, through a grounding gate, and back as a stream; a memory writer runs afterwards. Shared infrastructure: web search, models, SQLite.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.08"/></filter></defs>
<rect x="0.75" y="0.75" width="1278.5" height="878.5" rx="18" fill="#fafaf9" stroke="#d4d4d8" stroke-width="1.5"/>
<text x="40" y="56" font-size="26" font-weight="800" fill="#18181b" letter-spacing="-0.5">Orbit</text>
<text x="112" y="56" font-size="14" text-anchor="start" fill="#52525b" font-weight="500">request lifecycle  ·  one tool (web_search)  ·  two paths</text>
<rect x="700" y="42" width="16" height="16" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="724" y="55" font-size="12.5" text-anchor="start" fill="#3f3f46" font-weight="500">Model call</text>
<rect x="824" y="42" width="16" height="16" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
<text x="848" y="55" font-size="12.5" text-anchor="start" fill="#3f3f46" font-weight="500">Deterministic code</text>
<rect x="1008" y="42" width="16" height="16" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="1032" y="55" font-size="12.5" text-anchor="start" fill="#3f3f46" font-weight="500">Tool</text>
<rect x="1102" y="42" width="16" height="16" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="1126" y="55" font-size="12.5" text-anchor="start" fill="#3f3f46" font-weight="500">Store</text>
<g filter="url(#sh)">
<rect x="40" y="110" width="200" height="84" rx="12" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
<text x="56" y="139" font-size="15" font-weight="700" fill="#18181b">Browser</text>
<text x="56" y="162" font-size="12.5" fill="#52525b">React · Vite · Tailwind</text>
<text x="56" y="179" font-size="12.5" fill="#52525b">plan card · Auto/Fast/Deep</text>
<rect x="290" y="110" width="200" height="84" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
<text x="306" y="139" font-size="15" font-weight="700" fill="#27272a">API</text>
<text x="306" y="162" font-size="12.5" fill="#52525b">Hono · SSE · port 8000</text>
<text x="306" y="179" font-size="12.5" fill="#52525b">signed session · rate limits</text>
<rect x="540" y="110" width="250" height="84" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
<circle cx="562" cy="134" r="11" fill="#18181b"/>
<text x="562" y="138.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="582" y="139" font-size="15" font-weight="700" fill="#27272a">Context assembly</text>
<text x="556" y="162" font-size="12.5" fill="#52525b">date/tz · token-budgeted history</text>
<text x="556" y="179" font-size="12.5" fill="#52525b">memory block, no LLM</text>
<rect x="840" y="110" width="260" height="84" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<circle cx="862" cy="134" r="11" fill="#18181b"/>
<text x="862" y="138.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="882" y="139" font-size="15" font-weight="700" fill="#312e81">Router</text>
<text x="856" y="162" font-size="12.5" fill="#52525b">cheap LLM classifier, rules fallback</text>
<text x="856" y="179" font-size="12.5" fill="#52525b">user can force Fast / Deep</text>
</g>
<path d="M240,152 H290" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M490,152 H540" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M790,152 H840" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M970,194 V226 H220 V250" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M970,226 V250" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="520" y="219" font-size="11.5" text-anchor="start" fill="#4f46e5" font-weight="700">fast: most questions</text>
<text x="986" y="244" font-size="11.5" text-anchor="start" fill="#4f46e5" font-weight="700">deep: comparisons, multi-part, research</text>
<rect x="40" y="250" width="360" height="270" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="276" font-size="12" text-anchor="start" fill="#4338ca" font-weight="800">FAST PATH   ~5-20 s</text>
<rect x="440" y="250" width="800" height="270" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="460" y="276" font-size="12" text-anchor="start" fill="#4338ca" font-weight="800">DEEP PATH   ~15-40 s</text>
<g filter="url(#sh)">
<rect x="70" y="296" width="300" height="76" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="86" y="325" font-size="15" font-weight="700" fill="#312e81">Agent loop</text>
<text x="86" y="348" font-size="12.5" fill="#52525b">one model decides: search or answer</text>
<text x="86" y="365" font-size="12.5" fill="#52525b">streams the final answer</text>
<rect x="70" y="412" width="300" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="86" y="441" font-size="15" font-weight="700" fill="#064e3b">web_search</text>
<text x="86" y="464" font-size="12.5" fill="#52525b">at most 4 rounds</text>
<text x="86" y="481" font-size="12.5" fill="#52525b">budgets enforced in code, not prompt</text>
<rect x="460" y="335" width="150" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="476" y="364" font-size="15" font-weight="700" fill="#312e81">Planner</text>
<text x="476" y="387" font-size="12.5" fill="#52525b">2-4 sub-questions</text>
<text x="476" y="404" font-size="12.5" fill="#52525b">shown live in the UI</text>
<rect x="650" y="300" width="170" height="56" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="666" y="329" font-size="14" font-weight="700" fill="#312e81">Researcher 1</text>
<text x="666" y="352" font-size="12.5" fill="#52525b">own bounded search loop</text>
<rect x="650" y="370" width="170" height="56" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="666" y="399" font-size="14" font-weight="700" fill="#312e81">Researcher 2</text>
<text x="666" y="422" font-size="12.5" fill="#52525b">own bounded search loop</text>
<rect x="650" y="440" width="170" height="56" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="666" y="469" font-size="14" font-weight="700" fill="#312e81">Researcher 3</text>
<text x="666" y="492" font-size="12.5" fill="#52525b">own bounded search loop</text>
<rect x="860" y="335" width="150" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="876" y="364" font-size="15" font-weight="700" fill="#312e81">Synthesizer</text>
<text x="876" y="387" font-size="12.5" fill="#52525b">answer model writes</text>
<text x="876" y="404" font-size="12.5" fill="#52525b">one cited report</text>
<rect x="1050" y="335" width="170" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="1066" y="364" font-size="15" font-weight="700" fill="#312e81">Verifier</text>
<text x="1066" y="387" font-size="12.5" fill="#52525b">checks each claim</text>
<text x="1066" y="404" font-size="12.5" fill="#52525b">against its source;</text>
<text x="1066" y="421" font-size="12.5" fill="#52525b">rewrites once if unsupported</text>
</g>
<path d="M220,372 V412" fill="none" stroke="#52525b" stroke-width="1.6" marker-start="url(#arrS)" marker-end="url(#arr)"/>
<path d="M610,385 L650,328" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M820,328 L860,385" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M610,385 L650,398" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M820,398 L860,385" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M610,385 L650,468" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M820,468 L860,385" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M1010,385 H1050" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="650" y="292" font-size="11" text-anchor="start" fill="#4338ca" font-weight="700">parallel, 3 at a time</text>
<text x="460" y="506" font-size="11.5" text-anchor="start" fill="#71717a" font-weight="500" font-style="italic">Any failure before synthesis falls back to the fast path.</text>
<path d="M440,495 H400" fill="none" stroke="#a1a1aa" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M220,520 V548 H360 V575" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M1135,435 V548 H520 V575" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="232" y="545" font-size="11" text-anchor="start" fill="#71717a" font-weight="500">answer</text>
<g filter="url(#sh)">
<rect x="290" y="575" width="330" height="84" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
<circle cx="312" cy="599" r="11" fill="#18181b"/>
<text x="312" y="603.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="332" y="604" font-size="15" font-weight="700" fill="#27272a">Grounding gate</text>
<text x="306" y="627" font-size="12.5" fill="#52525b">citations must resolve to retrieved sources</text>
<text x="306" y="644" font-size="12.5" fill="#52525b">tags stripped · prompt-leak + stale-answer guards</text>
<rect x="690" y="575" width="270" height="84" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
<circle cx="712" cy="599" r="11" fill="#18181b"/>
<text x="712" y="603.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="732" y="604" font-size="15" font-weight="700" fill="#27272a">Stream to browser</text>
<text x="706" y="627" font-size="12.5" fill="#52525b">status, plan, tokens, then the</text>
<text x="706" y="644" font-size="12.5" fill="#52525b">final answer with cited sources</text>
<rect x="1000" y="575" width="240" height="84" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<circle cx="1022" cy="599" r="11" fill="#18181b"/>
<text x="1022" y="603.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<text x="1042" y="604" font-size="15" font-weight="700" fill="#312e81">Memory writer</text>
<text x="1016" y="627" font-size="12.5" fill="#52525b">summary · slotted facts · claims</text>
<text x="1016" y="644" font-size="12.5" fill="#52525b">async outbox, off the hot path</text>
</g>
<path d="M620,617 H690" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M960,617 H1000" fill="none" stroke="#52525b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="980" y="600" font-size="11" text-anchor="middle" fill="#71717a" font-weight="500">async</text>
<text x="40" y="696" font-size="12" text-anchor="start" fill="#52525b" font-weight="800">SHARED INFRASTRUCTURE, ALL BEHIND PORTS (swap an adapter, not the agent)</text>
<g filter="url(#sh)">
<rect x="40" y="710" width="530" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="56" y="739" font-size="15" font-weight="700" fill="#064e3b">web_search internals</text>
<text x="56" y="762" font-size="12.5" fill="#52525b">parallel query fan-out · TTL cache</text>
<text x="56" y="779" font-size="12.5" fill="#52525b">RRF fusion · dedupe · stable source ids</text>
<text x="56" y="796" font-size="12.5" fill="#52525b">page read: SSRF-guarded, DNS pinned at connect time</text>
<text x="56" y="813" font-size="12.5" fill="#52525b">BM25 passages under a token budget</text>
<text x="56" y="830" font-size="12.5" fill="#52525b">Tavily and Exa behind one SearchProvider, with failover</text>
<rect x="590" y="710" width="320" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="606" y="739" font-size="15" font-weight="700" fill="#312e81">Models</text>
<text x="606" y="762" font-size="12.5" fill="#52525b">Vercel AI SDK, chosen per role by env</text>
<text x="606" y="779" font-size="12.5" fill="#52525b">answer: Groq gpt-oss-120b (default)</text>
<text x="606" y="796" font-size="12.5" fill="#52525b">router, research, verifier: Gemini flash-lite</text>
<text x="606" y="813" font-size="12.5" fill="#52525b">any provider; local OpenAI-compatible</text>
<rect x="930" y="710" width="310" height="140" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="946" y="739" font-size="15" font-weight="700" fill="#78350f">SQLite memory</text>
<text x="946" y="762" font-size="12.5" fill="#52525b">all rows scoped per user (forUser view)</text>
<text x="946" y="779" font-size="12.5" fill="#52525b">episodes (FTS5) · dated claims</text>
<text x="946" y="796" font-size="12.5" fill="#52525b">facts in model-named slots; a new value</text>
<text x="946" y="813" font-size="12.5" fill="#52525b">replaces the old (extractor reuses names)</text>
<text x="946" y="830" font-size="12.5" fill="#52525b">outbox: idempotent, retried jobs</text>
</g>
</svg>